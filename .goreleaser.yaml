# Release: linux/darwin × amd64/arm64 static binaries.
# Asset names match scripts/install-binary.sh: herd_<version>_<os>_<arch>.tar.gz
version: 2
project_name: herd
builds:
  - id: herd
    main: ./cmd/herd
    binary: herd
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
archives:
  - formats: [tar.gz]
    name_template: "herd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE]
checksum:
  name_template: checksums.txt
