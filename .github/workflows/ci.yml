name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y tmux shellcheck
      - run: tmux -V
      - name: Version files agree
        run: |
          v=$(cat VERSION)
          grep -q "var version = \"$v\"" cmd/herd/main.go || { echo "VERSION ($v) != main.version"; exit 1; }
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: shellcheck install.sh agent-herd.tmux scripts/herd-hook scripts/install-binary.sh
  test-tmux-3-2:
    # Ubuntu 22.04 ships tmux 3.2a. Not required yet: tells us whether the
    # 3.3 minimum can be lowered.
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: tmux -V
      - run: go test -count=1 -short ./...
  test-macos:
    # Unit tests + build. The integration tests use a bash fake agent whose
    # process name macOS reports differently, so they run on Linux only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 ./internal/...
      - run: go build ./cmd/herd
